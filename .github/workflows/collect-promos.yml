name: Refresh verified coupons

on:
  schedule:
    - cron: "12 3,9,15,21 * * *" # 00:12, 06:12, 12:12, 18:12 KST
  workflow_dispatch:

concurrency:
  group: coupon-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Discover and verify coupons
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/collect.py

      - name: Publish material changes
        run: |
          git add data/promotions.json
          if git diff --staged --quiet; then
            echo "No coupon changes"
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "data: refresh verified coupons"
          git pull --rebase
          git push
